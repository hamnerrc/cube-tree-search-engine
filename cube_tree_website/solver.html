<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cube⑂tree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
    <link rel="stylesheet" href="styles.css?v=20261016a">
    <script src="js/profile.js?v=20261016a"></script>
    <script>
        // README "Profiles": nobody signed in (or not onboarded) -> sign-in first.
        (function () {
            var p = cubeProfiles && cubeProfiles.active();
            if (!p || !p.onboarded) location.replace('index.html');
        })();
    </script>
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <h1>cube⑂tree</h1>
            <nav class="page-nav" aria-label="pages">
                <a class="px-btn quiet" href="solver.html" aria-current="page">solve</a>
                <a class="px-btn quiet" href="algs.html">algs</a>
            </nav>
        </div>
        <div class="topbar-actions">
            <a class="px-btn quiet profile-chip" id="profile-chip" href="index.html?profiles" title="switch profile">
                <canvas width="32" height="32" aria-hidden="true"></canvas><span id="profile-name"></span>
            </a>
            <button type="button" class="px-btn icon" id="settings-btn" aria-label="settings" title="settings">⚙</button>
            <button type="button" class="px-btn icon" id="info-btn" aria-label="about" title="about">i</button>
        </div>
    </header>

    <main class="main">
        <div class="col cube-col">
            <section class="cube-panel" aria-label="cube">
                <div class="cube-stage brackets" id="cube-stage">
                    <canvas id="cube-canvas" aria-label="the cube at the playback position" role="img"></canvas>
                    <span class="stage-step" id="cube-step"></span>
                    <span class="stage-note" id="stage-note"></span>
                    <div class="zoom" role="group" aria-label="zoom">
                        <button type="button" class="px-btn icon quiet" id="zoom-in" aria-label="zoom in" title="zoom in">+</button>
                        <button type="button" class="px-btn icon quiet" id="zoom-out" aria-label="zoom out" title="zoom out">−</button>
                    </div>
                </div>
                <div class="playback">
                    <input type="range" class="scrub" id="scrub" min="0" max="0" value="0" step="1" aria-label="playback position">
                    <div class="play-row">
                        <button type="button" class="px-btn quiet" id="pb-start" aria-label="to the start" title="start">|&lt;</button>
                        <button type="button" class="px-btn quiet" id="pb-back" aria-label="one move back" title="back">&lt;</button>
                        <button type="button" class="px-btn quiet" id="pb-play" aria-label="play" title="play">&gt;&gt;</button>
                        <button type="button" class="px-btn quiet" id="pb-fwd" aria-label="one move forward" title="forward">&gt;</button>
                        <button type="button" class="px-btn quiet" id="pb-end" aria-label="to the end" title="end">&gt;|</button>
                    </div>
                </div>
            </section>
        </div>

        <div class="col">
            <section class="scramble-panel" aria-label="scramble">
                <div class="label-row">
                    <span class="label">scramble</span>
                    <span class="scramble-status" id="scramble-status"></span>
                    <div class="scramble-nav">
                        <button type="button" class="px-btn icon quiet" onclick="scrambleController.navigate(-1)" aria-label="previous scramble">‹</button>
                        <span class="count" id="scramble-pos">1/1</span>
                        <input type="hidden" id="current-scramble-num" value="1">
                        <button type="button" class="px-btn icon quiet" onclick="scrambleController.navigate(1)" aria-label="next scramble">›</button>
                        <button type="button" class="px-btn icon quiet" id="new-scramble-btn" aria-label="new random scramble" title="new random scramble">+</button>
                    </div>
                </div>
                <div id="scramble-display" class="scramble-text">loading…</div>
            </section>

            <section class="solution-panel" aria-label="solution">
                <div class="label-row">
                    <span class="label">solution</span>
                    <span class="move-count" id="move-count" title="slice turn metric / execution turn metric (the inspection is not counted)"></span>
                </div>
                <div class="editor brackets" id="editor">
                    <div class="editor-sizer" id="editor-sizer" aria-hidden="true"></div>
                    <div class="editor-shadow" id="editor-shadow" aria-hidden="true"></div>
                    <textarea id="solution-input" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"
                        aria-label="solution: one step per line" aria-describedby="search-status" aria-autocomplete="inline"></textarea>
                </div>
                <div class="editor-actions">
                    <button type="button" class="px-btn quiet" id="undo-btn" disabled>undo</button>
                    <button type="button" class="px-btn quiet" id="copy-btn" title="copy this scramble and its solution" disabled>copy</button>
                    <button type="button" class="px-btn quiet" id="copy-all-btn" title="copy every scramble with its solution" disabled>copy all</button>
                    <button type="button" class="px-btn quiet" id="critique-btn">critique</button>
                </div>
                <div class="status-line" id="search-status" role="status" aria-live="polite"></div>
                <aside class="searcher" id="searcher" aria-label="your tree-searcher">
                    <button type="button" class="searcher-sprite" id="searcher-sprite" aria-label="show or hide your tree-searcher's picks" aria-expanded="true">
                        <canvas width="64" height="64" aria-hidden="true"></canvas>
                        <span class="shine" aria-hidden="true"></span>
                    </button>
                    <section class="bubble" id="bubble" aria-live="polite">
                        <span class="bubble-title" id="bubble-title"></span>
                        <p class="say" id="searcher-say"></p>
                        <div class="picks" id="picks"></div>
                        <div class="bubble-actions" id="bubble-actions"></div>
                    </section>
                </aside>
            </section>
        </div>
    </main>

    <dialog class="drawer" id="settings" aria-label="settings">
        <div class="drawer-head">
            <h2>settings</h2>
            <button type="button" class="px-btn icon quiet close-btn" id="settings-close" aria-label="close">×</button>
        </div>
        <div class="drawer-body">
            <fieldset class="group">
                <legend>look</legend>
                <div class="row" id="theme-choices" role="radiogroup" aria-label="theme"></div>
                <div class="row">
                    <label>pixels
                        <select class="px-select" id="pixel-res" aria-label="pixel art">
                            <option value="chunky">chunky</option>
                            <option value="fine">fine (reduced pixel art)</option>
                            <option value="smooth">smooth</option>
                        </select>
                    </label>
                    <label class="px-check"><input type="checkbox" id="back-faces"> back faces</label>
                </div>
                <div class="row">
                    <label>animation
                        <select class="px-select" id="anim-speed" aria-label="animation speed">
                            <option value="0.5">slow</option>
                            <option value="1">normal</option>
                            <option value="2">fast</option>
                            <option value="0">off</option>
                        </select>
                    </label>
                </div>
            </fieldset>

            <fieldset class="group">
                <legend>filter</legend>
                <div class="row">
                    <label class="px-check" title="show later steps that solve two or more pairs at once"><input type="checkbox" id="multislot"> multislot</label>
                    <label class="px-check" title="show results with wide moves (r l u d f)"><input type="checkbox" id="wide-moves"> wide moves</label>
                    <label class="px-check" title="hide later steps that turn the R or L layer a half turn away from where the step started"><input type="checkbox" id="hide-unorthodox"> hide awkward f2l</label>
                    <label class="px-check" id="simple-pseudo-wrap" title="after a mismatched pair, only steps that repair it" hidden><input type="checkbox" id="simple-pseudo"> simple pseudo only</label>
                </div>
            </fieldset>

            <fieldset class="group">
                <legend>ranking</legend>
                <div class="row">
                    <label class="px-check" title="prefer steps that leave the remaining edges oriented and the back slots solved first; off: each step by itself alone"><input type="checkbox" id="pair-planning"> pair planning</label>
                </div>
            </fieldset>

            <fieldset class="group">
                <legend>last layer</legend>
                <div class="row">
                    <label>method
                        <select class="px-select" id="ll-method" aria-label="last layer method">
                            <option value="oll">oll + pll</option>
                            <option value="coll">coll when the edges are oriented</option>
                            <option value="zbll">zbll when the edges are oriented</option>
                        </select>
                    </label>
                </div>
                <div class="row">
                    <label class="px-check" title="at the last pair, suggest zbls and ols algs when they fit"><input type="checkbox" id="last-slot"> last slot algs (zbls, ols)</label>
                </div>
            </fieldset>

            <fieldset class="group">
                <legend>look-ahead</legend>
                <div class="row">
                    <label>depth
                        <select class="px-select" id="lookahead-depth" aria-label="look-ahead depth">
                            <option value="1" selected>off</option>
                            <option value="2">2 steps</option>
                            <option value="3">3 steps (slow)</option>
                        </select>
                    </label>
                    <label>breadth <input class="px-input" type="number" id="lookahead-breadth" value="5" min="1" max="50" style="width:70px"></label>
                </div>
            </fieldset>

            <fieldset class="group" id="search-group">
                <legend>search</legend>
                <div class="row" id="colors-group" role="group" aria-label="cross colours">
                    <label class="px-check"><input type="checkbox" value="white"> white</label>
                    <label class="px-check"><input type="checkbox" value="yellow"> yellow</label>
                    <label class="px-check"><input type="checkbox" value="green"> green</label>
                    <label class="px-check"><input type="checkbox" value="blue"> blue</label>
                    <label class="px-check"><input type="checkbox" value="red"> red</label>
                    <label class="px-check"><input type="checkbox" value="orange"> orange</label>
                </div>
                <div class="row" id="advanced-group" role="group" aria-label="first steps">
                    <label class="px-check"><input type="checkbox" value="xcross"> xcross</label>
                    <label class="px-check"><input type="checkbox" value="xxcross"> xxcross</label>
                    <label class="px-check"><input type="checkbox" value="xxxcross"> xxxcross</label>
                    <label class="px-check"><input type="checkbox" value="full_pseudo"> pseudo f2l</label>
                </div>
                <details>
                    <summary>per-type limits</summary>
                    <table class="limits-table">
                        <thead><tr><th>type</th><th>max sol.</th><th>depth</th><th>pseudo sol.</th><th>pseudo depth</th></tr></thead>
                        <tbody id="limits-body"></tbody>
                    </table>
                </details>
                <label class="label-head" for="scramble-input">scrambles</label>
                <textarea class="px-textarea" id="scramble-input" rows="4" placeholder="one scramble per line"></textarea>
                <div class="row">
                    <button type="button" class="px-btn" onclick="populateScrambles()">generate</button>
                    <input class="px-input" type="number" id="scramble-count" value="1" min="1" max="50" style="width:70px" aria-label="number of scrambles to generate">
                    <button type="button" class="px-btn primary" id="apply-search">apply</button>
                </div>
            </fieldset>

            <fieldset class="group">
                <legend>profile</legend>
                <div class="row">
                    <a class="px-btn" href="index.html?onboard">answer the questions again</a>
                    <a class="px-btn" href="index.html?profiles">switch profile</a>
                    <button type="button" class="px-btn" id="sign-out">sign out</button>
                </div>
            </fieldset>
        </div>
    </dialog>

    <script src="js/captions.js?v=20261016a"></script>
    <script src="js/skill-levels.js?v=20261016a"></script>
    <script src="js/searchers.js?v=20261016a"></script>
    <script src="js/pro-steps.js?v=20261016a"></script>
    <script src="js/script.js?v=20261016a"></script>
    <script src="js/facelet-cube.js?v=20261016a"></script>
    <script src="js/random-state-scramble.js?v=20261016a"></script>
    <script src="js/facelet-flags.js?v=20261016a"></script>
    <script src="js/cross-optimization.js?v=20261016a"></script>
    <script src="js/spelling-search.js?v=20261016a"></script>
    <script src="crossSolver/solver-helper.js?v=20261016a"></script>
    <script src="pseudoCrossSolver/solver-helper.js?v=20261016a"></script>
    <script src="js/search-scheduler.js?v=20261016a"></script>
    <script src="js/solver-bridge.js?v=20261016a"></script>
    <script src="js/alg-sets.js?v=20261016a"></script>
    <script src="js/last-layer.js?v=20261016a"></script>
    <script src="js/pixel-cube.js?v=20261016a"></script>
    <script src="js/solve-editor.js?v=20261016a"></script>
    <script src="js/suggest.js?v=20261016a"></script>
    <script src="js/critique.js?v=20261016a"></script>
    <script src="js/solver-ui.js?v=20261016a"></script>
</body>

</html>
