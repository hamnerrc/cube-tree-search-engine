<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cube⑂tree</title>
    <link rel="stylesheet" href="styles.css?v=48">
    <script src="js/profile.js?v=48"></script>
    <script>
        (function () {
            var p = cubeProfiles && cubeProfiles.active();
            if (!p || !p.onboarded) location.replace('index.html');
        })();
    </script>
</head>

<body>
    <header class="header">
        <a class="logo" href="solver.html">cube<span class="fork">⑂</span>tree</a>
        <nav class="tabs" aria-label="pages">
            <a class="tab" href="solver.html" aria-current="page">Solve</a>
            <a class="tab" href="algs.html">Algs</a>
        </nav>
        <div class="userbar">
            <button type="button" class="link" id="info-btn">Help</button>
            <a class="profile-chip" id="profile-chip" href="index.html?profiles" title="Switch profile">
                <span class="initial" aria-hidden="true"></span><span id="profile-name"></span>
            </a>
            <button type="button" class="btn" id="settings-btn">Options</button>
        </div>
    </header>

    <main class="solve-page">
        <section class="cube-box cube-panel" aria-label="cube">
            <div class="cube-stage" id="cube-stage">
                <canvas id="cube-canvas" aria-label="the cube at the playback position" role="img"></canvas>
                <span class="stage-step" id="cube-step"></span>
                <div class="zoom" role="group" aria-label="zoom">
                    <button type="button" class="btn tiny" id="zoom-in" aria-label="zoom in" title="Zoom in">+</button>
                    <button type="button" class="btn tiny" id="zoom-out" aria-label="zoom out" title="Zoom out">&minus;</button>
                </div>
                <span class="stage-note" id="stage-note"></span>
            </div>
            <div class="stages">
                <div class="gauge" id="gauge" role="img" aria-label="stages solved at this point">
                    <i data-stage="cross" title="Cross"></i><i data-stage="p1" title="First pair"></i><i data-stage="p2" title="Second pair"></i><i data-stage="p3" title="Third pair"></i><i data-stage="p4" title="Last pair"></i><i data-stage="oll" title="Last layer oriented"></i><i data-stage="pll" title="Solved"></i>
                </div>
                <div class="gauge-labels" aria-hidden="true"><span>Cross</span><span>F2L</span><span>LL</span></div>
            </div>
            <div class="playback">
                <input type="range" class="scrub" id="scrub" min="0" max="0" value="0" step="1" aria-label="playback position">
                <button type="button" class="btn" id="pb-start" aria-label="to the start" title="Start (scrambled)">&laquo;</button>
                <button type="button" class="btn" id="pb-back" aria-label="one move back" title="Back one move">&lsaquo;</button>
                <button type="button" class="btn play" id="pb-play" aria-label="play" title="Play">Play</button>
                <button type="button" class="btn" id="pb-fwd" aria-label="one move forward" title="Forward one move">&rsaquo;</button>
                <button type="button" class="btn" id="pb-end" aria-label="to the end" title="End">&raquo;</button>
            </div>
        </section>

        <div class="work">
            <section class="panel scramble-panel" aria-label="scramble">
                <div class="panel-head">
                    <h2>Scramble <span class="count" id="scramble-pos">1/1</span></h2>
                    <span class="scramble-status" id="scramble-status"></span>
                    <div class="scramble-nav">
                        <input type="hidden" id="current-scramble-num" value="1">
                        <button type="button" class="btn tiny" id="scramble-prev" aria-label="previous scramble" title="Previous scramble">&lsaquo;</button>
                        <button type="button" class="btn tiny" id="scramble-next" aria-label="next scramble" title="Next scramble">&rsaquo;</button>
                        <button type="button" class="btn tiny" id="new-scramble-btn" title="New random scramble">New</button>
                        <button type="button" class="btn tiny" id="scramble-edit-btn" aria-expanded="false" aria-controls="scramble-edit">Edit list</button>
                    </div>
                </div>
                <div id="scramble-display" class="scramble-text">loading…</div>
                <div class="scramble-edit" id="scramble-edit" hidden>
                    <textarea class="textarea" id="scramble-input" rows="4" placeholder="One scramble per line" aria-label="scrambles, one per line"></textarea>
                    <div class="row">
                        <button type="button" class="btn" id="generate-scrambles">Generate</button>
                        <input class="input" type="number" id="scramble-count" value="1" min="1" max="50" style="width:64px" aria-label="number of scrambles to generate">
                        <span class="hint">random-state</span>
                        <button type="button" class="btn primary" id="apply-scrambles">Use these</button>
                    </div>
                </div>
            </section>

            <section class="panel suggestions" id="suggestions" aria-label="suggestions" aria-live="polite">
                <div class="panel-head">
                    <h2 id="suggest-title"></h2>
                    <p class="suggest-note" id="suggest-note"></p>
                    <div class="suggest-actions" id="suggest-actions"></div>
                </div>
                <div class="picks" id="picks"></div>
            </section>

            <section class="panel solution-panel" aria-label="solution">
                <div class="panel-head">
                    <h2>Solution</h2>
                    <span class="move-count" id="move-count" title="slice turn metric / execution turn metric (inspection not counted)"></span>
                </div>
                <div class="editor" id="editor">
                    <div class="editor-gutter" id="editor-gutter" aria-hidden="true"></div>
                    <div class="editor-sizer" id="editor-sizer" aria-hidden="true"></div>
                    <div class="editor-shadow" id="editor-shadow" aria-hidden="true"></div>
                    <textarea id="solution-input" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"
                        aria-label="solution: one step per line" aria-describedby="search-status" aria-autocomplete="inline"></textarea>
                </div>
                <div class="status-line" id="search-status" role="status" aria-live="polite"></div>
                <div class="editor-foot">
                    <p class="key-legend" id="key-legend" aria-hidden="true"></p>
                    <div class="editor-actions">
                        <button type="button" class="btn" id="undo-btn" disabled>Undo</button>
                        <button type="button" class="btn" id="copy-btn" title="Copy this scramble and its solution" disabled>Copy</button>
                        <button type="button" class="btn" id="copy-all-btn" title="Copy every scramble with its solution" disabled>Copy all</button>
                        <button type="button" class="btn" id="critique-btn">Critique</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <dialog class="popup drawer" id="settings" aria-label="options">
        <div class="popup-head"><h2>Options</h2><button type="button" class="close-x" id="settings-close" aria-label="close">&times;</button></div>
        <div class="popup-tabs" role="tablist" aria-label="options">
            <button type="button" role="tab" data-tab="display" aria-selected="true">Display</button>
            <button type="button" role="tab" data-tab="steps" aria-selected="false">Steps</button>
            <button type="button" role="tab" data-tab="ll" aria-selected="false">Last layer</button>
            <button type="button" role="tab" data-tab="search" aria-selected="false">Search</button>
        </div>
        <div class="drawer-body">
            <div class="tab-page" data-page="display">
                <label class="field"><span class="name">Theme</span>
                    <select class="select" data-seg id="theme-select" aria-label="theme">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </label>
                <label class="field"><span class="name">Cube</span>
                    <select class="select" data-seg id="pixel-res" aria-label="cube rendering">
                        <option value="smooth">Smooth</option>
                        <option value="fine" data-short="Pixel">Pixel art</option>
                        <option value="chunky" data-short="Big pixels">Pixel art, big pixels</option>
                    </select>
                </label>
                <label class="field"><span class="name">Animation</span>
                    <select class="select" data-seg id="anim-speed" aria-label="animation speed">
                        <option value="0.5">Slow</option>
                        <option value="1">Normal</option>
                        <option value="2">Fast</option>
                        <option value="0" data-short="Off">Off (jump straight there)</option>
                    </select>
                </label>
                <label class="check opt"><input type="checkbox" id="back-faces"><span class="name">Show hidden faces</span><span class="desc">Back, left and bottom stickers drawn beside the cube.</span></label>
            </div>

            <div class="tab-page" data-page="steps" hidden>
                <label class="check opt" title="later steps that solve two or more pairs at once"><input type="checkbox" id="multislot"><span class="name">Multislot</span><span class="desc">Steps that solve two or more pairs at once.</span></label>
                <label class="check opt"><input type="checkbox" id="wide-moves"><span class="name">Wide moves</span><span class="desc">Allow r, l, u, d, f and b.</span></label>
                <label class="check opt"><input type="checkbox" id="hide-unorthodox"><span class="name">No R2/L2 detours</span><span class="desc">Skip pair solutions that take R or L a half turn from where they started, like R U R U' R' or R' U R'.</span></label>
                <label class="check opt" id="simple-pseudo-wrap" hidden><input type="checkbox" id="simple-pseudo"><span class="name">Simple pseudo only</span><span class="desc">Once a pair's in the wrong slot, only suggest steps that fix it.</span></label>
                <label class="check opt"><input type="checkbox" id="pair-planning"><span class="name">Plan ahead for EO and back slots</span><span class="desc">Prefer steps that keep edges oriented and get the back slots done early. Off, each step is judged on its own.</span></label>
                <label class="field"><span class="name">Look-ahead</span>
                    <span class="desc">Rank each step together with the best step(s) after it.</span>
                    <select class="select" data-seg id="lookahead-depth" aria-label="look-ahead">
                        <option value="1" selected>Off</option>
                        <option value="2" data-short="1 step">The next step</option>
                        <option value="3" data-short="2 steps">The next two steps (slow)</option>
                    </select>
                </label>
            </div>

            <div class="tab-page" data-page="ll" hidden>
                <label class="field"><span class="name">Method</span>
                    <select class="select" data-seg id="ll-method" aria-label="last layer method">
                        <option value="oll" data-short="OLL + PLL">OLL, then PLL</option>
                        <option value="coll" data-short="COLL">COLL (OLL with the corners), then EPLL</option>
                        <option value="zbll" data-short="ZBLL">ZBLL when the edges are oriented, else OLL + PLL</option>
                        <option value="1lll" data-short="1LLL">1LLL: the whole layer in one alg</option>
                    </select>
                </label>
                <label class="check opt"><input type="checkbox" id="hide-awkward-algs"><span class="name">Hide awkward algs</span><span class="desc">B, S, E or wide u/d/f/b moves, double rotations, or slow for the length. Kept if it's the one most people use.</span></label>
                <h3 class="sub-head">Last slot</h3>
                <p class="hint" data-caption="settings.ls.intro"></p>
                <label class="check opt"><input type="checkbox" id="ls-zbls"><span class="name">ZBLS</span><span class="desc">Any last pair, edges oriented for ZBLL.</span></label>
                <label class="check opt"><input type="checkbox" id="ls-wv"><span class="name">WV <span class="acr">winter variation</span></span><span class="desc">Connected pair, <span class="moves">R U' R'</span> insert, EO done: orients the corners.</span></label>
                <label class="check opt"><input type="checkbox" id="ls-sv"><span class="name">SV <span class="acr">summer variation</span></span><span class="desc">Split pair, <span class="moves">R U R'</span> insert, EO done: orients the corners.</span></label>
                <label class="check opt"><input type="checkbox" id="ls-vls"><span class="name">VLS</span><span class="desc">WV with any EO: orients edges and corners.</span></label>
                <label class="check opt"><input type="checkbox" id="ls-hls"><span class="name">HLS</span><span class="desc">SV with any EO: orients edges and corners.</span></label>
                <label class="check opt"><input type="checkbox" id="ls-ols"><span class="name">Full OLS</span><span class="desc">Any pair, any EO: orients the whole layer. 8,054 cases.</span></label>
                <p class="hint" data-caption="settings.ls.rule"></p>
            </div>

            <div class="tab-page" data-page="search" id="search-group" hidden>
                <div class="field"><span class="name">Cross colours</span>
                    <div class="row" id="colors-group" role="group" aria-label="cross colours">
                        <label class="check"><input type="checkbox" value="white"> White</label>
                        <label class="check"><input type="checkbox" value="yellow"> Yellow</label>
                        <label class="check"><input type="checkbox" value="green"> Green</label>
                        <label class="check"><input type="checkbox" value="blue"> Blue</label>
                        <label class="check"><input type="checkbox" value="red"> Red</label>
                        <label class="check"><input type="checkbox" value="orange"> Orange</label>
                    </div>
                </div>
                <div class="field"><span class="name">First step can also be</span>
                    <div class="row" id="advanced-group" role="group" aria-label="first steps">
                        <label class="check"><input type="checkbox" value="xcross"> XCross</label>
                        <label class="check"><input type="checkbox" value="xxcross"> XXCross</label>
                        <label class="check"><input type="checkbox" value="xxxcross"> XXXCross</label>
                        <label class="check" title="pairs solved into the wrong slot, fixed later"><input type="checkbox" value="full_pseudo"> Pseudo F2L</label>
                    </div>
                </div>
                <details>
                    <summary>Move limits per step type</summary>
                    <table class="limits-table">
                        <thead><tr><th>type</th><th>max sol.</th><th>depth</th><th>pseudo sol.</th><th>pseudo depth</th></tr></thead>
                        <tbody id="limits-body"></tbody>
                    </table>
                </details>
                <div class="row">
                    <button type="button" class="btn primary" id="apply-search">Apply and search again</button>
                </div>
            </div>
        </div>
    </dialog>

    <script src="js/captions.js?v=48"></script>
    <script src="js/segmented.js?v=48"></script>
    <script src="js/skill-levels.js?v=48"></script>
    <script src="js/pro-steps.js?v=48"></script>
    <script src="js/script.js?v=48"></script>
    <script src="js/facelet-cube.js?v=48"></script>
    <script src="js/random-state-scramble.js?v=48"></script>
    <script src="js/facelet-flags.js?v=48"></script>
    <script src="js/cross-optimization.js?v=48"></script>
    <script src="js/spelling-search.js?v=48"></script>
    <script src="crossSolver/solver-helper.js?v=48"></script>
    <script src="pseudoCrossSolver/solver-helper.js?v=48"></script>
    <script src="js/search-scheduler.js?v=48"></script>
    <script src="js/solver-bridge.js?v=48"></script>
    <script src="js/alg-sets.js?v=48"></script>
    <script src="js/last-layer.js?v=48"></script>
    <script src="js/pixel-cube.js?v=48"></script>
    <script src="js/solve-editor.js?v=48"></script>
    <script src="js/suggest.js?v=48"></script>
    <script src="js/critique.js?v=48"></script>
    <script src="js/solver-ui.js?v=48"></script>
</body>

</html>
