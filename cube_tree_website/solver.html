<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cube⑂tree solver</title>
    <link rel="stylesheet" href="styles.css?v=20261009g">
</head>

<body>
    <header class="banner">
        <a href="index.html" class="back-btn" aria-label="back to settings">‹ back</a>
        <div class="brand">
            <h1>cube⑂tree</h1>
            <button type="button" class="info-btn" id="info-btn" aria-label="about the options" title="about the options">i</button>
        </div>
    </header>

    <main class="container">
        <section class="card scramble-viewer" aria-label="scramble">
            <div class="viewer-controls">
                <button type="button" onclick="scrambleController.navigate(-1)" aria-label="previous scramble">‹</button>
                <input type="number" id="current-scramble-num" min="1" value="1" aria-label="scramble number"
                    onchange="scrambleController.jumpTo(this.value)">
                <button type="button" onclick="scrambleController.navigate(1)" aria-label="next scramble">›</button>
            </div>
            <div id="scramble-display" class="scramble-display">loading scramble…</div>
            <div id="scramble-status" class="scramble-status"></div>
        </section>

        <section class="card solution-box" aria-label="solution so far">
            <div class="card-head">
                <h2>solution</h2>
                <div class="solution-actions">
                    <button type="button" id="copy-btn" class="small-btn" disabled>copy</button>
                    <a id="cubedb-link" class="small-btn link-btn" href="#" target="_blank" rel="noopener" aria-disabled="true"
                        title="open this scramble and solution on cubedb.net">cubedb ↗</a>
                    <button type="button" id="undo-btn" class="small-btn" onclick="handleUndoClick()" disabled>undo</button>
                </div>
            </div>
            <ol id="solution-steps" class="solution-steps" aria-live="polite"></ol>
            <p id="solution-empty" class="solution-empty">click a result to commit it as the next step.</p>
        </section>

        <section class="results-controls" aria-label="result options">
            <fieldset class="control-group">
                <legend>filter</legend>
                <label class="check" title="show later steps that solve two or more pairs at once">
                    <input type="checkbox" id="multislot"> multislot
                </label>
                <label class="check" title="show results with wide moves (r l u d f): e.g. f R' f' for B U' B', u R U' R' for D y R U' R'">
                    <input type="checkbox" id="wide-moves"> wide moves
                </label>
                <label class="check" title="hide later steps that turn the R or L layer a half turn away from where the step started (e.g. R U R U' R', or an R2 from the start; R U R2 U' R is fine). first steps are never hidden">
                    <input type="checkbox" id="hide-unorthodox"> hide awkward f2l solutions
                </label>
                <label class="check" id="simple-pseudo-wrap" title="after a mismatched (pseudo) pair, only list the steps that repair it" hidden>
                    <input type="checkbox" id="simple-pseudo"> simple pseudo only
                </label>
            </fieldset>
            <fieldset class="control-group">
                <legend>ranking</legend>
                <label class="check" title="rank pair choices the way a planning solver does: leave the remaining edges oriented (fewer rotations later) and the back slots solved first. untick for plain step speed">
                    <input type="checkbox" id="pair-planning"> pair planning
                </label>
            </fieldset>
            <fieldset class="control-group">
                <legend>look-ahead</legend>
                <label title="re-rank the top results by the best combined tpp of the next steps">
                    <select id="lookahead-depth" aria-label="look-ahead depth">
                        <option value="1" selected>off</option>
                        <option value="2">2 steps</option>
                        <option value="3">3 steps</option>
                        <option value="4">4 steps</option>
                        <option value="5">5 steps</option>
                    </select>
                    <span class="slow-tag" id="lookahead-slow" hidden>slow</span>
                </label>
                <label title="how many of the top results get a look-ahead">breadth
                    <input type="number" id="lookahead-breadth" value="5" min="1" max="50">
                </label>
            </fieldset>
            <label class="page-size" title="results per page">show
                <input type="number" id="page-size" value="25" min="1" max="500">
            </label>
        </section>

        <div class="search-state" id="search-state">
            <div id="search-status" class="search-status" role="status" aria-live="polite"></div>
            <div class="progress" aria-hidden="true"><span></span></div>
        </div>

        <div class="table-wrapper">
            <table class="results-table">
                <thead>
                    <tr>
                        <th title="rank">#</th>
                        <th title="cross colour">colour</th>
                        <th title="what this step solves">type</th>
                        <th title="inspection rotation before the first step">rotation</th>
                        <th title="f2l edges this step places">edges</th>
                        <th title="f2l corners this step places">corners</th>
                        <th title="the moves of this step; click a row to commit it">alg</th>
                        <th title="time per piece of the whole solve so far, this step included; lower is faster">tpp</th>
                        <th title="with look-ahead on: the combined tpp of the best next steps, and those steps">look-ahead</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                </tbody>
            </table>
        </div>

        <nav class="pagination" id="pagination" aria-label="result pages"></nav>
    </main>

    <script src="js/pro-steps.js?v=20261009g"></script>
    <script src="js/script.js?v=20261009g"></script>
    <script src="js/facelet-cube.js?v=20261009g"></script>
    <script src="js/facelet-flags.js?v=20261009g"></script>
    <script src="js/cross-optimization.js?v=20261009g"></script>
    <script src="js/spelling-search.js?v=20261009g"></script>
    <script src="crossSolver/solver-helper.js?v=20261009g"></script>
    <script src="pseudoCrossSolver/solver-helper.js?v=20261009g"></script>
    <script src="js/search-scheduler.js?v=20261009g"></script>
    <script src="js/solver-bridge.js?v=20261009g"></script>
    <script src="js/solver-ui.js?v=20261009g"></script>
</body>

</html>
