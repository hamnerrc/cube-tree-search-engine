<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cube⑂tree · algs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
    <link rel="stylesheet" href="styles.css?v=20261018a">
    <script src="js/profile.js?v=20261018a"></script>
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <h1>cube⑂tree</h1>
            <!-- the menu of UI_references/1-bit_inspo_UI.png: capitals, the first letter lit -->
            <nav class="page-nav" aria-label="pages">
                <a class="menu-item" href="solver.html"><span class="key">S</span>olve</a>
                <a class="menu-item" href="algs.html" aria-current="page"><span class="key">A</span>lgs</a>
                <a class="menu-item" id="settings-link" href="solver.html#settings"><span class="key">S</span>ettings</a>
                <button type="button" class="menu-item" id="info-btn"><span class="key">W</span>hat's this ?</button>
            </nav>
        </div>
        <div class="topbar-actions">
            <a class="profile-chip" id="profile-chip" href="index.html?profiles" title="switch profile">
                <canvas width="32" height="32" aria-hidden="true"></canvas><span id="profile-name"></span>
            </a>
        </div>
    </header>

    <main class="algs-main">
        <!-- the sets, as a terminal menu (UI_references/1-bit_inspo_UI.png), each with what you know of it -->
        <nav class="set-menu window" aria-label="alg sets">
            <span class="window-tab">Sets</span>
            <ul class="set-list" id="set-tabs" role="tablist" aria-label="alg set"></ul>
        </nav>

        <section class="set-window window" aria-labelledby="set-name">
            <span class="window-tab" id="set-name">oll</span>
            <div class="algs-search brackets" id="algs-search">
                <div class="search-shadow" id="search-shadow" aria-hidden="true"></div>
                <input type="text" id="alg-search" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"
                    aria-label="search cases by name, or type moves" aria-describedby="search-note" aria-autocomplete="inline">
            </div>
            <div class="search-note" id="search-note" role="status" aria-live="polite"></div>
            <div class="set-bar" id="set-bar">
                <p class="set-title" id="set-title"></p>
                <div class="progress" id="progress" aria-live="polite"></div>
            </div>
            <!-- subsets as an inventory row of slots (UI_references/UI_inspo.png) -->
            <div class="slot-bar" id="group-chips" role="group" aria-label="subsets"></div>
            <div class="slot-bar sub" id="group-chips-2" role="group" aria-label="pair placement" hidden></div>
            <p class="subset-note" id="subset-note"></p>
            <div class="grid-tools" id="grid-tools">
                <div class="seg" role="group" aria-label="show">
                    <button type="button" class="chip" data-show="all" aria-pressed="true">All</button>
                    <button type="button" class="chip" data-show="learn" aria-pressed="false">To learn</button>
                    <button type="button" class="chip" data-show="known" aria-pressed="false">Known</button>
                </div>
                <button type="button" class="px-btn learn-btn" id="learn-mode" aria-pressed="false">Mark what I know</button>
            </div>
            <p class="learn-hint" id="learn-hint" hidden></p>
            <section class="case-grid" id="case-grid" aria-label="cases"></section>
            <section class="match-list" id="match-list" aria-label="matching algs" hidden></section>
        </section>
    </main>

    <!-- the card a case shows on hover (UI_references/showdown_UI_inspo.png tooltips) -->
    <div class="case-card" id="case-card" role="tooltip" hidden></div>

    <dialog class="case-dialog window" id="case-dialog" aria-labelledby="case-title">
        <span class="window-tab" id="case-title"></span>
        <button type="button" class="close-box" id="case-close" aria-label="close">X</button>
        <div class="case-body">
            <div class="case-view">
                <div class="cube-stage case-stage" id="case-stage">
                    <canvas id="case-cube" role="img" aria-label="the case on the cube"></canvas>
                </div>
                <div class="play-row">
                    <button type="button" class="px-btn" id="case-reset" aria-label="back to the case" title="the case">|&lt;</button>
                    <button type="button" class="px-btn" id="case-back" aria-label="one move back" title="back">&lt;</button>
                    <button type="button" class="px-btn" id="case-play" aria-label="play" title="play">&gt;&gt;</button>
                    <button type="button" class="px-btn" id="case-fwd" aria-label="one move forward" title="forward">&gt;</button>
                </div>
                <button type="button" class="px-btn known-btn" id="case-known" aria-pressed="false">I know this case</button>
            </div>
            <div class="case-algs">
                <p class="case-sub" id="case-sub"></p>
                <ol class="alg-list" id="alg-list"></ol>
            </div>
        </div>
    </dialog>

    <script src="js/captions.js?v=20261018a"></script>
    <script src="js/pro-steps.js?v=20261018a"></script>
    <script src="js/script.js?v=20261018a"></script>
    <script src="js/facelet-cube.js?v=20261018a"></script>
    <script src="js/searchers.js?v=20261018a"></script>
    <script src="js/pixel-cube.js?v=20261018a"></script>
    <script src="js/alg-sets.js?v=20261018a"></script>
    <script src="js/last-layer.js?v=20261018a"></script>
    <script src="js/case-diagram.js?v=20261018a"></script>
    <script src="js/algs-ui.js?v=20261018a"></script>
</body>

</html>
