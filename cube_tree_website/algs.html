<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cube⑂tree · algs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
    <link rel="stylesheet" href="styles.css?v=20261015b">
    <script src="js/profile.js?v=20261015b"></script>
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <h1>cube⑂tree</h1>
            <nav class="page-nav" aria-label="pages">
                <a class="px-btn quiet" href="solver.html">solve</a>
                <a class="px-btn quiet" href="algs.html" aria-current="page">algs</a>
            </nav>
        </div>
        <div class="topbar-actions">
            <a class="px-btn quiet profile-chip" id="profile-chip" href="index.html?profiles" title="switch profile">
                <canvas width="32" height="32" aria-hidden="true"></canvas><span id="profile-name"></span>
            </a>
        </div>
    </header>

    <main class="algs-main">
        <section class="algs-head" aria-label="alg sets">
            <div class="set-tabs" id="set-tabs" role="tablist" aria-label="alg set"></div>
            <div class="algs-search brackets" id="algs-search">
                <div class="search-shadow" id="search-shadow" aria-hidden="true"></div>
                <input type="text" id="alg-search" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"
                    aria-label="search cases by name, or type moves" aria-describedby="search-note" aria-autocomplete="inline">
            </div>
            <div class="search-note" id="search-note" role="status" aria-live="polite"></div>
            <p class="set-title" id="set-title"></p>
            <p class="set-legend" id="set-legend"></p>
            <div class="group-chips" id="group-chips" role="group" aria-label="subsets"></div>
        </section>
        <section class="case-grid" id="case-grid" aria-label="cases"></section>
        <section class="match-list" id="match-list" aria-label="matching algs" hidden></section>
    </main>

    <dialog class="case-dialog" id="case-dialog" aria-labelledby="case-title">
        <div class="info-head">
            <h2 id="case-title"></h2>
            <button type="button" class="px-btn icon quiet close-btn" id="case-close" aria-label="close">×</button>
        </div>
        <div class="case-body">
            <div class="case-view">
                <div class="cube-stage case-stage brackets" id="case-stage">
                    <canvas id="case-cube" role="img" aria-label="the case on the cube"></canvas>
                </div>
                <div class="play-row">
                    <button type="button" class="px-btn quiet" id="case-reset" aria-label="back to the case" title="the case">|&lt;</button>
                    <button type="button" class="px-btn quiet" id="case-back" aria-label="one move back" title="back">&lt;</button>
                    <button type="button" class="px-btn quiet" id="case-play" aria-label="play" title="play">&gt;&gt;</button>
                    <button type="button" class="px-btn quiet" id="case-fwd" aria-label="one move forward" title="forward">&gt;</button>
                </div>
            </div>
            <div class="case-algs">
                <p class="case-sub" id="case-sub"></p>
                <ol class="alg-list" id="alg-list"></ol>
            </div>
        </div>
    </dialog>

    <script src="js/captions.js?v=20261015b"></script>
    <script src="js/pro-steps.js?v=20261015b"></script>
    <script src="js/script.js?v=20261015b"></script>
    <script src="js/facelet-cube.js?v=20261015b"></script>
    <script src="js/searchers.js?v=20261015b"></script>
    <script src="js/pixel-cube.js?v=20261015b"></script>
    <script src="js/alg-sets.js?v=20261015b"></script>
    <script src="js/case-diagram.js?v=20261015b"></script>
    <script src="js/algs-ui.js?v=20261015b"></script>
</body>

</html>
