name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The site lives in cube_tree_website/, not the repo root (the
          # repo also holds archived_attempts/ and dev-only tooling that
          # isn't part of the shipped site) -- this is what makes
          # cube_tree_website/index.html the Pages root, not a subpath.
          path: cube_tree_website
      - id: deployment
        uses: actions/deploy-pages@v4
