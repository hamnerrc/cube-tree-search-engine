name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A new push supersedes any older deploy that is still queued or running:
# with "cancel-in-progress: false" a run stuck in the queue (2026-10-05:
# c3e8eca waited hours for a runner) held the group and blocked every later
# deploy. The group name changed so new runs no longer wait on that stuck run.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The site lives in cube_tree_website/, not the repo root (the
          # repo also holds archived_attempts/ and dev-only tooling that
          # isn't part of the shipped site) -- this is what makes
          # cube_tree_website/index.html the Pages root, not a subpath.
          path: cube_tree_website
      - id: deployment
        uses: actions/deploy-pages@v4
